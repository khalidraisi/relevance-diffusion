[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qafd-rag"
version = "0.1.0"
description = "Query-aware flow diffusion retrieval over graphs, independent of any specific graph backend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
